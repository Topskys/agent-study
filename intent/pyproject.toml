[project]
name = "intent-funnel"
version = "0.1.0"
description = "意图识别模块（V3 三层漏斗）：规则 → 语义 → LLM 兜底 + 四分支交互 + 会话槽位缓存"
requires-python = ">=3.11"
dependencies = [
    "memory-system",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.uv.sources]
memory-system = { path = "../memory", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intent_funnel"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
