[project]
name = "ai-agent-rag"
version = "0.1.0"
description = "模块化 RAG 系统，面向 Agent 的内置知识库模块"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "jieba>=0.42.0",
    "rank-bm25>=0.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
docx = ["python-docx>=1.0.0"]
pdf = ["PyMuPDF>=1.23.0"]
local-embed = ["sentence-transformers>=2.2.0"]
all = ["rag[docx,pdf,local-embed]"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
