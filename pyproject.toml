[project]
name = "ai-agent-rag"
version = "0.1.0"
description = "模块化 RAG 系统，面向 Agent 的内置知识库模块"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "jieba>=0.42.0",
    "rank-bm25>=0.2.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.4.0",
]

[project.optional-dependencies]
docx = ["python-docx>=1.0.0"]
pdf = ["PyMuPDF>=1.23.0"]
local-embed = ["sentence-transformers>=2.2.0"]
pgvector = ["psycopg2-binary>=2.9.0", "pgvector>=0.4.0"]
milvus = ["pymilvus>=2.3.0"]
yaml = ["pyyaml>=6.0"]
all = ["python-docx>=1.0.0", "PyMuPDF>=1.23.0", "sentence-transformers>=2.2.0", "psycopg2-binary>=2.9.0", "pgvector>=0.4.0", "pymilvus>=2.3.0", "pyyaml>=6.0"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
