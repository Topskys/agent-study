[project]
name = "agent-mvp"
version = "0.1.0"
description = "Agent MVP：统一 LLM 接入层(llm-client) + function calling + while 循环"
requires-python = ">=3.11"
dependencies = [
    "memory-system[real]",
    "intent-funnel",
    "llm-client",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "tavily-python>=0.7.0",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.uv.sources]
memory-system = { path = "../memory", editable = true }
intent-funnel = { path = "../intent", editable = true }
llm-client = { path = "../llm", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff.lint]
# BLE001: 工具层把"网络/限流/参数异常"统一转成文本返回给模型，属预期兜底
# I001:   import 顺序交由工具链统一；手动整理反而易反复
# DTZ005: get_time 返回本地时间（本地会话语义），不强制 UTC
# TRY004: calculator 用 ValueError 表达"非法语法"，面向模型文本，不换 TypeError
# S110:   trace 吞掉日志写入异常（日志失败不影响对话主流程）；agent 的 turn_end 打点同理
# SIM115: trace 持有长生命周期文件句柄用于轮转，不适合 with 上下文
ignore = [
    "BLE001",
    "I001",
    "DTZ005",
    "TRY004",
    "S110",
    "SIM115",
]
