# Agent MVP 配置文件
# api_key 可从环境变量 OPENAI_API_KEY 读取，也可直接填写

llm:
  api_key: ${ZEN_API_KEY}
  base_url: ${ZEN_BASE_URL}
  model: ${ZEN_MODEL}
  temperature: 1.0
  top_p: 0.95
  max_tokens: 16384
  timeout: 120
  max_retries: 3
  # 流式输出：主循环 reason 逐 chunk、边收边打（DCE 体验）；关掉则一次性返回
  stream: true

agent:
  system_prompt: ${SYSTEM_PROMPT}
  max_rounds: 10

memory:
  # mock: 确定性哈希向量（无语义，秒级）；real: 本地 BGE 模型（需安装 memory-system[real]）
  embed_mode: real
  db_path: agent_memory.db
  user_id: default_user
  top_k: 3
  session_importance: 0.8

intent:
  # v3 三层漏斗意图识别（规则 → 语义 → LLM 兜底）+ 四分支交互
  # 业务意图/槽位定义见 resources/intent_config.json；config_path 可覆盖
  confirm_timeout: 30
  highrisk_timeout: 60

tools:
  # 联网搜索：Bing Web Search API v7 订阅密钥（可在 .env 配置 BING_SEARCH_API_KEY）
  bing_search_api_key: ${BING_SEARCH_API_KEY}
  # Tavily AI Search API 密钥（可在 .env 配置 TVLY_API_KEY 或 TAVILY_API_KEY）
  tavily_api_key: ${TVLY_API_KEY}

safety:
  high_risk_keywords: ["删除", "删掉", "删", "清空", "清除", "全部", "批量", "群发", "外发", "永久", "注销"]

# Agent 运行轨迹：事件按 JSONL 落盘，单文件满 max_bytes 轮转，只保留 backup_count 个
trace:
  enable: true
  log_dir: data/trace
  max_bytes: 10485760   # 10MB
  backup_count: 5
